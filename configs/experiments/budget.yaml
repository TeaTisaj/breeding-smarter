id: E6_budget_and_kinship
description: "P12 gain under a dF budget (1%, 0.5%, 0.25%; SYN_M also 0.1% per generation) vs conservation OCS, and recorded vs true (oracle) kinship."
seed: 20261024
dataset: v1
generations: 10
breeds:
  SYN_S: {replicates: 20}
  SYN_M: {replicates: 10, extra_strategies: [CC-gain010-mc1]}
strategies: [CC-gain100-mc1, CC-gain050-mc1, CC-gain025-mc1, CC-ocs-mc1, CC-ocs-mc1-oracle]
adoption: [1.0]
profile: exp_pairing
scoring: default
coordination: default
coi_cap: {value: 0.065, source: eu-platform-guide}
s3_top_probs: {value: [0.5, 0.3, 0.2], assumption: true, note: "breeders keep some freedom"}
s4_lambda: {value: 1.0, assumption: true}
ebv_every_years: {value: 5, assumption: true}
registration_rate: {value: 1.0, assumption: true, note: "simplification: every live-born puppy is registered during experiments"}
