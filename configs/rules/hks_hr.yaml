profile: hks_hr
title: "Hrvatski kinološki savez (Croatia), Pravilnik o uzgoju"
rules:
  - id: hks_hd_exclusion
    type: health_grade_exclusion
    params: {test_type: HD, exclude: [E], missing: allow}
    severity: HARD
    source: hks-pravilnik
    verified: true
    note: "HD E/I and E/II exclude from a breeding licence"
  - id: hks_dam_min_age
    type: min_age
    params: {sex: F, months: 15}
    severity: HARD
    source: hks-pravilnik
    verified: false
    note: "source covers hunting breeds (non-small); unverified for other breeds"
  - id: hks_dam_max_age
    type: max_age
    params: {sex: F, years: 8}
    severity: HARD
    source: hks-pravilnik
    verified: false
    note: "source covers hunting breeds; unverified for other breeds"
  # min_interval_between_litters: [HUMAN] add only if the current Pravilnik states one
  - id: hks_max_caesareans
    type: max_caesareans
    params: {n: 2}
    severity: HARD
    source: hks-clubs-2026
    verified: false
    note: "no further breeding after two caesarean sections (secondary source; check the Pravilnik)"
  - id: hks_one_litter_12m
    type: max_litters_in_window
    params: {max: 1, window_months: 12}
    severity: HARD
    source: hks-clubs-2026
    verified: false
    note: "HKS says one litter per calendar year; a 12-month window is an approximation"
